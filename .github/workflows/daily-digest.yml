name: Costco daily digest

on:
  schedule:
    # 15:00 UTC = ~08:00 America/Los_Angeles. Adjust as you like.
    # GitHub cron is UTC and can run a few minutes late — that's fine.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          COSTCO_INTERESTS: ${{ vars.COSTCO_INTERESTS }}
          COSTCO_REGION: ${{ vars.COSTCO_REGION }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          # Optional Costco.com source — leave the secret unset to skip it.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          COSTCO_ONLINE_URLS: ${{ vars.COSTCO_ONLINE_URLS }}
          LOOKBACK_HOURS: "30"
        run: python costco_digest.py
